services:
  - type: web
    name: billsahi
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: render
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TINKER_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: HSN_MODEL_PATH
        sync: false
